[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-git-committer"
version = "0.1.8"
description = "Generate Conventional Commits using Groq AI"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Byte Blast", email = "gnxbd4vbtm@privaterelay.appleid.com" }
]

license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]


[project.scripts]
aic = "ai_git_committer.cli:main"
ai-git-committer = "ai_git_committer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_git_committer = [
    "*.json"
]

[project.urls]
Homepage = "https://github.com/gnxbd4vbtm-ops/ai-git-committer"
Repository = "https://github.com/gnxbd4vbtm-ops/ai-git-committer"
Issues = "https://github.com/gnxbd4vbtm-ops/ai-git-committer/issues"
